<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonio Gómez Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<!-- Existing portfolio markup retained. -->
<script>
(function () {
    "use strict";
    function scrollToElement(el) { if (!el || typeof el.scrollIntoView !== "function") return; try { el.scrollIntoView({behavior: "smooth", block: "start"}); } catch (e) { try { el.scrollIntoView(); } catch (_) {} } }
    function byHash(hash) { if (typeof hash !== "string") return null; var id=hash.charAt(0)==="#" ? hash.slice(1) : hash; if (!id) return null; try { return document.getElementById(decodeURIComponent(id)); } catch (e) { return null; } }
    function setup() { try { var hero=document.querySelector(".hero-btn"); if (hero) hero.addEventListener("click", function(e) { e.preventDefault(); scrollToElement(document.getElementById("about")); }); var ds=Array.from(document.querySelectorAll("details.dropdown")); ds.forEach(function(d) { d.addEventListener("toggle", function() { if (!d.open) return; ds.forEach(function(o) { if (o!==d) o.open=false; }); scrollToElement(d.querySelector("summary")); }); }); var target=byHash(window.location.hash); if (target) { var d=target.closest ? target.closest("details.dropdown") : null; if (d) { d.open=true; setTimeout(function(){scrollToElement(target);},0); } else scrollToElement(target); } } catch(e) { console.warn("Safe navigation setup failed",e); } }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup); else setup();
}());
</script>
</body>
</html>

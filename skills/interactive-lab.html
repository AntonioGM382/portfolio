<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2027">
  <title>Skills Lab | Antonio Gómez</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #0f2027; --panel: #203a43; --line: rgba(0, 188, 212, .32); --accent: #00bcd4; --highlight: #00eaff; --muted: #ddd; --text: #fff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 0; }
    body { margin: 0; overflow: hidden; color: var(--text); background: linear-gradient(155deg, var(--bg), var(--panel), #2c5364); font: 400 14px/1.45 Roboto, sans-serif; }
    a { color: inherit; }
    button { font: inherit; }
    .shell { width: 100%; height: 100vh; height: 100dvh; min-height: 0; margin: 0; padding: 10px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
    .topbar { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--panel); text-decoration: none; font-size: .82rem; transition: background .18s ease, border-color .18s ease; }
    .back-link:hover, .back-link:focus-visible { color: var(--text); border-color: var(--highlight); background: rgba(0, 234, 255, .14); outline: none; }
    .brand-mark { color: var(--accent); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .lab-layout { min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 12px; }
    .sidebar, .viewer { min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 13px; background: linear-gradient(145deg, rgba(32, 58, 67, .96), rgba(15, 32, 39, .96)); box-shadow: 0 14px 36px rgba(0, 0, 0, .2); }
    .sidebar { padding: 10px; overflow-y: auto; }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 6px 8px; color: var(--text); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .item-count, .step-status { color: var(--muted); font-size: .7rem; }
    .skill-nav { display: grid; gap: 5px; }
    .skill-nav button { width: 100%; display: grid; grid-template-columns: 27px minmax(0, 1fr); align-items: center; gap: 9px; padding: 9px 8px; border: 1px solid transparent; border-radius: 9px; color: var(--text); background: transparent; text-align: left; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    .skill-nav button:hover { background: rgba(0, 188, 212, .11); }
    .skill-nav button[aria-current="true"] { border-color: var(--line); background: rgba(0, 188, 212, .2); }
    .skill-nav button:focus-visible, .control:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
    .nav-index { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: var(--accent); font-size: .68rem; }
    .nav-title { overflow: hidden; font-size: .8rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .viewer { display: grid; grid-template-rows: auto 2px minmax(0, 1fr) auto; overflow: hidden; }
    .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 64px; padding: 9px 15px; }
    .viewer-heading { min-width: 0; }
    .viewer-eyebrow { color: var(--accent); font-size: .63rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .viewer-title { margin: 1px 0 2px; color: var(--text); font-size: 1.15rem; line-height: 1.2; }
    .viewer-description { overflow: hidden; max-width: 660px; margin: 0; color: var(--muted); font-size: .75rem; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-count { flex: 0 0 auto; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: rgba(15, 32, 39, .7); font-size: .68rem; }
    .progress-track { margin: 0 15px; overflow: hidden; background: rgba(0, 188, 212, .16); }
    .progress-fill { width: 16.666%; height: 2px; background: var(--accent); transition: width .2s ease; }
    .frame-wrap { min-width: 0; min-height: 0; margin: 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
    .demo-frame { display: block; width: 100%; height: 100%; min-height: 0; border: 0; background: var(--bg); }
    .demo-frame.is-loading { opacity: .5; }
    .viewer-controls { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px 8px; }
    .control { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel); cursor: pointer; transition: background .16s ease, border-color .16s ease; }
    .control:hover:not(:disabled) { border-color: var(--highlight); background: rgba(0, 234, 255, .14); }
    .control:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 900px) {
      .shell { padding: 8px; gap: 8px; }
      .lab-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
      .sidebar { padding: 7px; overflow: hidden; }
      .sidebar-heading { padding: 1px 5px 5px; }
      .skill-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
      .skill-nav button { flex: 0 0 auto; width: auto; grid-template-columns: 23px auto; padding: 6px 8px; }
      .nav-index { width: 22px; height: 22px; }
      .viewer-head { min-height: 58px; padding: 7px 10px; }
      .frame-wrap { margin: 6px; }
    }
    @media (max-width: 520px) {
      .shell { padding: 6px; gap: 6px; }
      .topbar { min-height: 36px; }
      .brand-mark { font-size: .58rem; letter-spacing: .08em; }
      .back-link { min-height: 34px; padding: 6px 9px; font-size: .76rem; }
      .viewer-head { min-height: 52px; }
      .viewer-title { font-size: 1rem; }
      .viewer-description { max-width: 245px; font-size: .68rem; }
      .viewer-controls { min-height: 42px; padding: 0 7px 6px; }
      .control { min-height: 34px; padding: 6px 8px; font-size: .76rem; }
      .step-status { font-size: .64rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Skills Lab navigation"><a class="back-link" href="../index.html#skillsDropdown"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Skills</a><span class="brand-mark">Antonio Gómez / Skills Lab</span></nav>
    <section class="lab-layout" aria-label="Interactive skills viewer">
      <aside class="sidebar" aria-label="Choose a demo"><div class="sidebar-heading"><span>Experiences</span><span class="item-count">6 demos</span></div><nav class="skill-nav" id="skillNav" aria-label="Skills Lab demos"></nav></aside>
      <section class="viewer" aria-labelledby="viewerTitle">
        <div class="viewer-head"><div class="viewer-heading"><span class="viewer-eyebrow">Selected experience</span><h1 class="viewer-title" id="viewerTitle">Snake AI</h1><p class="viewer-description" id="viewerDescription"></p></div><span class="viewer-count" id="viewerCount" aria-live="polite">01 / 06</span></div>
        <div class="progress-track" role="progressbar" id="progressTrack" aria-label="Skills Lab progress" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"><div class="progress-fill" id="progressFill"></div></div>
        <div class="frame-wrap"><iframe class="demo-frame is-loading" id="demoFrame" title="Snake AI interactive demo"></iframe></div>
        <div class="viewer-controls"><button class="control" id="previousButton" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i><span>Previous</span></button><span class="step-status" id="stepStatus" aria-live="polite">Demo 1 of 6</span><button class="control" id="nextButton" type="button"><span>Next</span><i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>
      </section>
    </section>
  </main>
  <script>
    (function () {
      "use strict";
      var demos = [
        { title: "Snake AI", url: "snake-game.html", description: "Play the classic grid game or watch an agent navigate with a safety-first strategy." },
        { title: "Sorting Visualizer", url: "sorting-visualizer.html", description: "Compare sorting methods as the data rearranges in a live visual display." },
        { title: "A* Pathfinding", url: "astar-visualizer.html", description: "Draw obstacles on a grid and watch heuristic search find a route." },
        { title: "Fireworks Particles", url: "particle-system.html", description: "Create glowing particle bursts and explore a multi-stage visual system." },
        { title: "Critical Path Simulator", url: "cpm.html", description: "Adjust task durations and see dependencies, slack, and delivery timing update." },
        { title: "2D Raycasting", url: "raycasting.html", description: "Move a light source and obstacles to explore real-time rays and soft shadows." }
      ];
      var nav = document.getElementById("skillNav");
      var frame = document.getElementById("demoFrame");
      var title = document.getElementById("viewerTitle");
      var description = document.getElementById("viewerDescription");
      var count = document.getElementById("viewerCount");
      var progress = document.getElementById("progressFill");
      var progressTrack = document.getElementById("progressTrack");
      var status = document.getElementById("stepStatus");
      var previous = document.getElementById("previousButton");
      var next = document.getElementById("nextButton");
      var current = 0;
      var navButtons = [];
      var demoTheme = `
        :root { color-scheme: dark; --bg: #0f2027; --panel: #203a43; --line: rgba(0,188,212,.34); --muted: #ddd; --mint: #00bcd4; --blue: #00eaff; --red: #00eaff; --amber: #00bcd4; }
        body { color: #fff !important; background: linear-gradient(to bottom,#0f2027,#203a43,#2c5364) !important; }
        .panel { border-color: rgba(0,188,212,.34) !important; background: linear-gradient(145deg,rgba(32,58,67,.96),rgba(15,32,39,.96)) !important; }
        .back, .btn, .control { color: #fff !important; border-color: rgba(0,188,212,.34) !important; background: #203a43 !important; }
        .back:hover, .btn:hover, .control:hover:not(:disabled) { color: #fff !important; border-color: #00eaff !important; background: rgba(0,234,255,.14) !important; }
        .btn.primary { color: #fff !important; border-color: #00bcd4 !important; background: #00bcd4 !important; }
        .node.end, .dot.end { background: #00eaff !important; }
        .node.path, .dot.path { background: #00bcd4 !important; border-color: #00bcd4 !important; }
        .task-id, .node.critical rect, .edge.critical { fill: #00bcd4 !important; stroke: #00bcd4 !important; }
        .node.selected rect, .node:hover rect, .node.delayed rect { stroke: #00eaff !important; }
        .key.slack { background: #00eaff !important; }
        @media (min-width: 901px) {
          html, body { width: 100% !important; height: 100% !important; min-height: 0 !important; overflow: hidden !important; }
          body { padding: 0 !important; }
          body > main.shell { width: 100% !important; max-width: none !important; height: 100% !important; min-height: 0 !important; margin: 0 !important; padding: 10px !important; display: flex !important; flex-direction: column !important; }
          body > main.shell > .top, body > main.shell > header { display: none !important; }
          body > main.shell > section { flex: 1 1 auto !important; min-height: 0 !important; margin: 0 !important; }
          body > main.shell > section.layout { height: 100% !important; grid-template-columns: minmax(0,1fr) 220px !important; gap: 10px !important; }
          body > main.shell > section > .panel, body > main.shell > section.layout > .panel { min-height: 0 !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; padding: 10px !important; }
          .board-wrap, .canvas-wrap, .grid-wrap, .graph-wrap { min-height: 0 !important; flex: 1 1 auto !important; }
          .board-wrap { display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; }
          #game { width: auto !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; aspect-ratio: 1; }
          #canvas { width: 100% !important; height: 100% !important; min-height: 0 !important; flex: 1 1 auto !important; object-fit: contain; }
          #fireworks, #light { width: 100% !important; height: 100% !important; min-height: 0 !important; flex: 1 1 auto !important; }
          #grid { grid-template-columns: repeat(40,clamp(11px,1.7vw,18px)) !important; }
          .node { width: clamp(11px,1.7vw,18px) !important; height: clamp(11px,1.7vw,18px) !important; }
          .graph-wrap { overflow: hidden !important; }
          svg { width: 100% !important; min-width: 0 !important; min-height: 0 !important; height: 100% !important; flex: 1 1 auto !important; }
        }
        @media (max-width: 900px) {
          html, body { width: 100% !important; height: 100% !important; min-height: 0 !important; overflow: auto !important; }
          body { padding: 0 !important; }
          body > main.shell { width: 100% !important; max-width: none !important; min-height: 100% !important; height: auto !important; margin: 0 !important; padding: 10px !important; }
          body > main.shell > .top, body > main.shell > header { display: none !important; }
          body > main.shell > section { min-height: 65vh !important; margin: 0 !important; }
          body > main.shell > section.layout { grid-template-columns: 1fr !important; height: auto !important; }
          body > main.shell > section > .panel { min-height: 0 !important; }
          .canvas-wrap { min-height: 38vh !important; }
          #game { max-width: 100% !important; height: auto !important; }
          #grid { grid-template-columns: repeat(40,clamp(11px,3vw,18px)) !important; }
          .node { width: clamp(11px,3vw,18px) !important; height: clamp(11px,3vw,18px) !important; }
          .graph-wrap { overflow: auto !important; }
          svg { min-width: 620px !important; }
        }
      `;
      function applyFrameTheme() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.head) return;
          var style = doc.getElementById("skills-lab-theme");
          if (!style) {
            style = doc.createElement("style");
            style.id = "skills-lab-theme";
            doc.head.appendChild(style);
          }
          style.textContent = demoTheme;
        } catch (error) {
          status.textContent = "Demo styling is unavailable in this browser.";
        }
      }
      function render(index) {
        current = Math.max(0, Math.min(demos.length - 1, index));
        var demo = demos[current];
        title.textContent = demo.title;
        description.textContent = demo.description;
        count.textContent = String(current + 1).padStart(2, "0") + " / " + String(demos.length).padStart(2, "0");
        status.textContent = "Demo " + (current + 1) + " of " + demos.length;
        progress.style.width = ((current + 1) / demos.length * 100) + "%";
        progressTrack.setAttribute("aria-valuenow", String(current + 1));
        previous.disabled = current === 0;
        next.disabled = current === demos.length - 1;
        frame.title = demo.title + " interactive demo";
        frame.classList.add("is-loading");
        frame.src = demo.url;
        navButtons.forEach(function (button, buttonIndex) { button.setAttribute("aria-current", buttonIndex === current ? "true" : "false"); });
        if (window.history && window.history.replaceState) window.history.replaceState(null, "", "#" + encodeURIComponent(demo.url.replace(/\.html$/, "")));
      }
      demos.forEach(function (demo, index) {
        var button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-current", "false");
        button.setAttribute("aria-label", "Open " + demo.title);
        button.innerHTML = '<span class="nav-index" aria-hidden="true">' + String(index + 1).padStart(2, "0") + '</span><span class="nav-title"></span>';
        button.querySelector(".nav-title").textContent = demo.title;
        button.addEventListener("click", function () { render(index); });
        nav.appendChild(button);
        navButtons.push(button);
      });
      frame.addEventListener("load", function () { frame.classList.remove("is-loading"); applyFrameTheme(); });
      window.addEventListener("resize", applyFrameTheme);
      previous.addEventListener("click", function () { render(current - 1); });
      next.addEventListener("click", function () { render(current + 1); });
      document.addEventListener("keydown", function (event) {
        if (event.altKey || event.ctrlKey || event.metaKey || (event.target && event.target.closest && event.target.closest("iframe"))) return;
        if (event.key === "ArrowLeft" && current > 0) render(current - 1);
        if (event.key === "ArrowRight" && current < demos.length - 1) render(current + 1);
      });
      var hash = decodeURIComponent(window.location.hash.slice(1));
      var startAt = demos.findIndex(function (demo) { return demo.url.replace(/\.html$/, "") === hash; });
      render(startAt >= 0 ? startAt : 0);
    }());
  </script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Skills Lab | Antonio Gómez</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: dark; --bg:#0f2027; --panel:#203a43; --line:rgba(0,188,212,.32); --accent:#00bcd4; --highlight:#00eaff; --muted:#ddd; --text:#fff; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; min-height:0; }
    body { margin:0; overflow:hidden; color:var(--text); background:linear-gradient(155deg,var(--bg),var(--panel),#2c5364); font:400 14px/1.45 Roboto,sans-serif; }
    a { color:inherit; } button { font:inherit; }
    .shell { width:100%; height:100vh; height:100dvh; min-height:0; margin:0; padding:10px 14px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px; }
    .topbar { min-height:40px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .back-link,.deep-dive-button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:38px; padding:8px 13px; border:1px solid var(--line); border-radius:9px; color:var(--text); background:var(--panel); text-decoration:none; font-size:.82rem; cursor:pointer; }
    .back-link:hover,.deep-dive-button:hover,.back-link:focus-visible,.deep-dive-button:focus-visible { border-color:var(--highlight); background:rgba(0,234,255,.14); outline:2px solid transparent; }
    .brand-mark { color:var(--accent); font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .lab-layout { min-height:0; display:grid; grid-template-columns:216px minmax(0,1fr); gap:12px; }
    .sidebar,.viewer { min-width:0; min-height:0; border:1px solid var(--line); border-radius:13px; background:linear-gradient(145deg,rgba(32,58,67,.96),rgba(15,32,39,.96)); box-shadow:0 14px 36px rgba(0,0,0,.2); }
    .sidebar { padding:10px; overflow-y:auto; }
    .sidebar-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 6px 8px; color:var(--text); font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .item-count,.step-status { color:var(--muted); font-size:.7rem; }
    .skill-nav { display:grid; gap:5px; }
    .skill-nav button { width:100%; display:grid; grid-template-columns:27px minmax(0,1fr); align-items:center; gap:9px; padding:9px 8px; border:1px solid transparent; border-radius:9px; color:var(--text); background:transparent; text-align:left; cursor:pointer; }
    .skill-nav button:hover { background:rgba(0,188,212,.11); }
    .skill-nav button[aria-current="true"] { border-color:var(--line); background:rgba(0,188,212,.2); }
    .skill-nav button:focus-visible,.control:focus-visible { outline:2px solid var(--highlight); outline-offset:2px; }
    .nav-index { width:25px; height:25px; display:grid; place-items:center; border:1px solid var(--line); border-radius:7px; color:var(--accent); font-size:.68rem; }
    .nav-title { overflow:hidden; font-size:.8rem; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    .viewer { display:grid; grid-template-rows:auto 2px minmax(0,1fr) auto; overflow:hidden; }
    .viewer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:64px; padding:9px 15px; }
    .viewer-heading { min-width:0; }
    .viewer-eyebrow { color:var(--accent); font-size:.63rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .viewer-title { margin:1px 0 2px; color:var(--text); font-size:1.15rem; line-height:1.2; }
    .viewer-description { max-width:660px; margin:0; overflow:hidden; color:var(--muted); font-size:.75rem; text-overflow:ellipsis; white-space:nowrap; }
    .viewer-actions { display:flex; align-items:center; flex:0 0 auto; gap:8px; }
    .viewer-count { padding:5px 8px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:rgba(15,32,39,.7); font-size:.68rem; }
    .progress-track { margin:0 15px; overflow:hidden; background:rgba(0,188,212,.16); }
    .progress-fill { width:16.666%; height:2px; background:var(--accent); transition:width .2s ease; }
    .frame-wrap { min-width:0; min-height:0; margin:8px; overflow:hidden; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
    .demo-frame { display:block; width:100%; height:100%; min-height:0; border:0; background:var(--bg); }
    .demo-frame.is-loading { opacity:.5; }
    .viewer-controls { min-height:46px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px 8px; }
    .control { min-height:34px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:var(--panel); cursor:pointer; }
    .control:hover:not(:disabled) { border-color:var(--highlight); background:rgba(0,234,255,.14); }
    .control:disabled { opacity:.45; cursor:not-allowed; }
    .deep-dive-button { min-height:34px; padding:6px 10px; color:#fff; background:rgba(0,188,212,.18); font-size:.73rem; font-weight:700; white-space:nowrap; }
    .deep-dive-backdrop { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(2,9,14,.78); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); }
    .deep-dive-backdrop[open] { display:flex; }
    .deep-dive-dialog { width:min(820px,100%); max-height:min(86vh,900px); overflow:auto; border:1px solid rgba(0,234,255,.4); border-radius:18px; color:var(--text); background:linear-gradient(145deg,#203a43,#0f2027 72%); box-shadow:0 28px 100px rgba(0,0,0,.6),0 0 40px rgba(0,188,212,.12); }
    .deep-dive-header { position:sticky; top:0; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:20px 22px 14px; border-bottom:1px solid var(--line); background:rgba(15,32,39,.96); }
    .deep-dive-eyebrow { color:var(--accent); font-size:.67rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .deep-dive-title { margin:4px 0 0; font-size:clamp(1.35rem,4vw,1.9rem); line-height:1.15; }
    .deep-dive-close { flex:0 0 auto; width:38px; height:38px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:var(--panel); cursor:pointer; }
    .deep-dive-close:hover,.deep-dive-close:focus-visible { border-color:var(--highlight); outline:2px solid var(--highlight); outline-offset:2px; }
    .deep-dive-body { padding:18px 22px 22px; }
    .deep-dive-lead { margin:0 0 17px; color:#e2f5f7; line-height:1.65; }
    .deep-dive-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .deep-dive-card { min-width:0; padding:14px; border:1px solid var(--line); border-radius:12px; background:rgba(7,19,27,.58); }
    .deep-dive-card h3 { margin:0 0 7px; color:var(--highlight); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; }
    .deep-dive-card p,.deep-dive-card ul { margin:0; color:#d4e5e9; font-size:.86rem; line-height:1.6; }
    .deep-dive-card ul { padding-left:18px; }
    .deep-dive-card li+li { margin-top:5px; }
    .deep-dive-code { grid-column:1/-1; }
    .deep-dive-code pre { margin:0; overflow:auto; padding:12px; border:1px solid rgba(0,234,255,.2); border-radius:9px; color:#d8fbff; background:#07131b; font: .76rem/1.6 'Roboto Mono',monospace; white-space:pre-wrap; }
    @media(max-width:900px) { .shell{padding:8px;gap:8px}.lab-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px}.sidebar{padding:7px;overflow:hidden}.sidebar-heading{padding:1px 5px 5px}.skill-nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}.skill-nav button{flex:0 0 auto;width:auto;grid-template-columns:23px auto;padding:6px 8px}.nav-index{width:22px;height:22px}.viewer-head{min-height:58px;padding:7px 10px}.frame-wrap{margin:6px} }
    @media(max-width:520px) { .shell{padding:6px;gap:6px}.topbar{min-height:36px}.brand-mark{font-size:.58rem;letter-spacing:.08em}.back-link{min-height:34px;padding:6px 9px;font-size:.76rem}.viewer-head{min-height:52px}.viewer-title{font-size:1rem}.viewer-description{max-width:245px;font-size:.68rem}.viewer-actions{gap:5px}.viewer-count{padding:4px 6px;font-size:.62rem}.deep-dive-button{min-height:32px;padding:5px 7px;font-size:.66rem}.viewer-controls{min-height:42px;padding:0 7px 6px}.control{min-height:34px;padding:6px 8px;font-size:.76rem}.step-status{font-size:.64rem}.deep-dive-backdrop{padding:10px}.deep-dive-dialog{max-height:92vh;border-radius:14px}.deep-dive-header{padding:15px}.deep-dive-body{padding:14px}.deep-dive-grid{grid-template-columns:1fr}.deep-dive-code{grid-column:auto} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important} }
  </style>

      function initializeLab() {
      var demos = [
        { title:"Snake AI",url:"snake-game.html",description:"Play the classic grid game or watch an agent navigate with a safety-first strategy.",lead:"The board is a 20 by 20 grid. The automated agent follows a Hamiltonian cycle that visits every cell, which gives a safe route for filling the board.",algorithm:"A precomputed cycle maps each cell to its position. Each move checks that advancing toward a candidate cell preserves the body order along the cycle and avoids occupied cells. Shortcuts are allowed only when they preserve the invariant and reduce distance to food.",complexity:"Cycle creation and index lookup: O(N) time and O(N) space for N cells. A move checks at most four candidate neighbors and scans the body, so safety checks are O(L), where L is snake length.",architecture:"A canvas renders the grid, body, and food. The game loop separates route selection, collision checks, body updates, food placement, and drawing. The length invariant is checked after every committed move.",snippet:"cycleAt[cellId] = cyclePosition\nfor each legal neighbor:\n  reject if occupied or cycle order is unsafe\n  keep the cycle successor as the guaranteed safe choice\nchoose a safe food shortcut only below the occupancy limit"},
        { title:"Sorting Visualizer",url:"sorting-visualizer.html",description:"Compare sorting methods as the data rearranges in a live visual display.",lead:"The canvas draws normalized values as bars while asynchronous sorting routines expose comparisons and swaps step by step.",algorithm:"Bubble Sort compares adjacent values and swaps out-of-order pairs. Quick Sort uses the final element as pivot, partitions values smaller than the pivot to its left, places the pivot, and recursively sorts each partition.",complexity:"Bubble Sort: O(n squared) time and O(1) extra space. Quick Sort: average O(n log n) time, worst O(n squared), with O(log n) average recursion space and O(n) worst recursion space.",architecture:"A shared renderer highlights the active indices and sorted suffix. Async waits use the speed slider to pace frames. Shuffle regenerates values; the busy flag prevents overlapping sort runs.",snippet:"pivot = values[high]\nboundary = low\nfor each index before high:\n  if value < pivot: swap into left partition\nswap pivot into boundary\nrecurse on left and right partitions"},
        { title:"A* Pathfinding",url:"astar-visualizer.html",description:"Draw obstacles on a grid and watch heuristic search find a route.",lead:"A* searches a four-direction grid. It prioritizes the cell with the lowest estimated total cost and reconstructs the route by following predecessor links from the goal.",algorithm:"The heuristic is Manhattan distance, which is admissible for unit-cost, four-direction movement. Arrays store g scores and predecessors. A Set tracks open and closed nodes; walls are skipped during neighbor expansion.",complexity:"This implementation linearly scans the open Set to select the minimum f score on each iteration, giving O(V squared) worst-case time for V grid cells. Search storage is O(V) space.",architecture:"Grid indices are integers. Neighbor generation checks bounds before returning adjacent cells. The visual loop marks visited cells and then animates the reconstructed shortest path.",snippet:"g[start] = 0\nwhile open is not empty:\n  current = open node minimizing g[current] + Manhattan(current, goal)\n  relax each traversable neighbor\n  cameFrom[neighbor] = current\nretrace cameFrom from goal to start"},
        { title:"Fireworks Particles",url:"particle-system.html",description:"Create glowing particle bursts and explore a multi-stage visual system.",lead:"Particle bursts, rocket trails, and fading sparks are updated in an animation loop and painted on a canvas with additive blending.",algorithm:"Particles use simple velocity, drag, gravity, and lifetime updates. A reusable object pool reduces repeated allocation. Particles are grouped into color buckets before batched drawing, and a hard cap bounds active particle work.",complexity:"For P active particles and R rockets, each frame is O(P + R), plus O(P) grouping and drawing. Storage is O(P + C), where C is the configured particle cap and pool limit.",architecture:"Pointer and touch events create bursts or launch rockets. ResizeObserver adapts the canvas backing resolution to device pixel ratio and a pixel budget. Visibility and pause states stop simulation work while hidden.",snippet:"for particle in activeParticles:\n  apply drag and gravity\n  advance position and lifetime\n  recycle expired particle into pool\n  bucket surviving particle by color\ndraw each bucket in batches"},
        { title:"Critical Path Simulator",url:"cpm.html",description:"Adjust task durations and see dependencies, slack, and delivery timing update.",lead:"The simulator models tasks as a directed acyclic dependency graph. It computes earliest dates in topological order, then latest dates in reverse order from the project finish.",algorithm:"Forward pass: ES is the maximum predecessor EF and EF is ES plus duration. Backward pass: LF is the minimum successor LS, or the project finish for terminal tasks. LS is LF minus duration; float is LS minus ES. Zero float marks critical work.",complexity:"The current small-network implementation repeatedly searches the task list for available topological nodes and scans tasks for successors. That makes its straightforward passes O(V squared + V times E) time in the current form and O(V + E) space.",architecture:"Task records contain duration, predecessor IDs, and fixed diagram coordinates. Each edit recalculates the schedule, updates the inspector table, draws dependency edges, and styles zero-float nodes and edges.",snippet:"forward in topological order:\n  ES = max(predecessor EF)\n  EF = ES + duration\nbackward in reverse order:\n  LF = min(successor LS) or project finish\n  LS = LF - duration\n  float = LS - ES"},
        { title:"2D Raycasting",url:"raycasting.html",description:"Move a light source and obstacles to explore real-time rays and soft shadows.",lead:"The light field is approximated by casting rays toward uniformly spaced angles and toward tiny angle offsets around each rectangle corner.",algorithm:"Each ray is intersected with axis-aligned rectangle bounds using slab entry and exit distances. The nearest positive hit across obstacles and canvas edges becomes a polygon vertex. Sorted vertices define the visible light region.",complexity:"With R rays and O obstacles, each frame costs O((R + O) times O) for intersection tests, plus O((R + O) log(R + O)) to sort angles. Temporary point storage is O(R + O).",architecture:"Pointer events drag the light or move rectangular blockers. ResizeObserver resizes the drawing surface. Canvas gradients color the visibility polygon, while obstacle rectangles are drawn afterward.",snippet:"for each ray angle:\n  nearest = distance to canvas boundary\n  for each rectangle:\n    test ray against x and y slabs\n    keep nearest positive intersection\n  append light + direction * nearest\nsort vertices by angle and fill polygon"}
      ];

      function contentCard(heading,text,code){var card=document.createElement('section');card.className='deep-dive-card';var h=document.createElement('h3');h.textContent=heading;card.appendChild(h);if(code){var pre=document.createElement('pre');pre.textContent=text;card.className+=' deep-dive-code';card.appendChild(pre)}else{var p=document.createElement('p');p.textContent=text;card.appendChild(p)}return card}

      function applyFrameTheme(){try{var doc=frame.contentDocument;if(!doc||!doc.head)return;var style=doc.getElementById('skills-lab-theme');if(!style){style=doc.createElement('style');style.id='skills-lab-theme';doc.head.appendChild(style)}style.textContent=demoTheme;if(frameObserver)frameObserver.disconnect();if(frame.src.indexOf('cpm.html')!==-1){var nodes=doc.getElementById('nodes');if(nodes){var shorten=function(){nodes.querySelectorAll('.task-time').forEach(function(el){var match=el.textContent.match(/ES\s+(\d+)\s+EF\s+(\d+)\s+Float\s+(\d+)d/);if(match)el.textContent='ES '+match[1]+' EF '+match[2]+' Float '+match[3]+'d'})};shorten();frameObserver=new MutationObserver(shorten);frameObserver.observe(nodes,{childList:true,subtree:true})}var walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);var textNode;while((textNode=walker.nextNode()))if(/[\u2013\u2014]/.test(textNode.nodeValue))textNode.nodeValue=textNode.nodeValue.replace(/[\u2013\u2014]/g,'-')}}catch(error){status.textContent='Demo styling is unavailable in this browser.'}}
      function render(index){current=Math.max(0,Math.min(demos.length-1,index));var demo=demos[current];title.textContent=demo.title;description.textContent=demo.description;count.textContent=String(current+1).padStart(2,'0')+' / '+String(demos.length).padStart(2,'0');status.textContent='Demo '+(current+1)+' of '+demos.length;progress.style.width=((current+1)/demos.length*100)+'%';progressTrack.setAttribute('aria-valuenow',String(current+1));previous.disabled=current===0;next.disabled=current===demos.length-1;frame.title=demo.title+' interactive demo';frame.classList.add('is-loading');if(frame.getAttribute("src")!==demo.url)frame.src=demo.url;navButtons.forEach(function(button,i){button.setAttribute('aria-current',i===current?'true':'false')});if(window.history&&window.history.replaceState)window.history.replaceState(null,'','#'+encodeURIComponent(demo.url.replace(/\.html$/,'')))}
      demos.forEach(function(demo,index){var button=document.createElement('button');button.type='button';button.setAttribute('aria-current','false');button.setAttribute('aria-label','Open '+demo.title);button.innerHTML='<span class="nav-index" aria-hidden="true">'+String(index+1).padStart(2,'0')+'</span><span class="nav-title"></span>';button.querySelector('.nav-title').textContent=demo.title;button.addEventListener('click',function(){render(index)});nav.appendChild(button);navButtons.push(button)});
      frame.addEventListener('load',function(){frame.classList.remove('is-loading');applyFrameTheme()});window.addEventListener('resize',applyFrameTheme);previous.addEventListener('click',function(){render(current-1)});next.addEventListener('click',function(){render(current+1)});openDeepDive.addEventListener('click',openModal);closeDeepDive.addEventListener('click',closeModal);backdrop.addEventListener('click',function(event){if(event.target===backdrop)closeModal()});document.addEventListener('keydown',function(event){if(backdrop.hasAttribute('open')){if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key==='Tab'){var focusables=dialog.querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"])');if(!focusables.length)return;var first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}return}if(event.altKey||event.ctrlKey||event.metaKey||(event.target&&event.target.closest&&event.target.closest('iframe')))return;if(event.key==='ArrowLeft'&&current>0)render(current-1);if(event.key==='ArrowRight'&&current<demos.length-1)render(current+1)});
      var hash;try{hash=decodeURIComponent(window.location.hash.slice(1))}catch(error){hash=""}var startAt=demos.findIndex(function(demo){return demo.url.replace(/\.html$/,'')===hash});render(startAt>=0?startAt:0);
      }
      if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initializeLab,{once:true});else initializeLab();

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131b">
  <title>Skills Lab | Antonio Gómez</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { color-scheme: dark; --bg: #07131b; --panel: #0d202a; --line: rgba(140, 230, 239, .17); --mint: #71f2c2; --cyan: #70e5dc; --muted: #a9c1c6; --text: #eff8fa; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body { min-height: 100vh; margin: 0; color: var(--text); background: radial-gradient(ellipse at 18% 0%, rgba(23, 68, 82, .8), transparent 34%), linear-gradient(155deg, #07131b 0%, #0d2029 55%, #071219 100%); font: 400 15px/1.55 Roboto, sans-serif; }
    a { color: inherit; }
    button { font: inherit; }
    .shell { width: min(1240px, calc(100% - 48px)); margin: 0 auto; padding: 26px 0 38px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 34px; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; color: #c8e5e8; background: rgba(12, 31, 41, .7); text-decoration: none; font-size: .86rem; transition: color .18s ease, border-color .18s ease, background .18s ease; }
    .back-link:hover, .back-link:focus-visible { color: var(--mint); border-color: rgba(113, 242, 194, .52); background: rgba(29, 72, 76, .42); outline: none; }
    .brand-mark { color: var(--mint); font-size: .72rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .intro { max-width: 760px; margin-bottom: 26px; }
    .eyebrow { color: var(--mint); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 8px; font-size: clamp(2.15rem, 5vw, 3.4rem); line-height: 1.04; letter-spacing: -.045em; }
    .intro p { max-width: 650px; margin: 0; color: var(--muted); font-size: 1rem; }
    .lab-layout { display: grid; grid-template-columns: 258px minmax(0, 1fr); gap: 18px; align-items: stretch; }
    .sidebar, .viewer { min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(14, 36, 46, .94), rgba(8, 24, 33, .96)); box-shadow: 0 22px 60px rgba(0, 0, 0, .22), inset 0 1px rgba(255, 255, 255, .045); }
    .sidebar { padding: 16px 12px; }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 8px 12px; color: #d6ebed; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .item-count { color: #8ca9b0; font: 500 .72rem/1 Roboto, sans-serif; letter-spacing: .02em; }
    .skill-nav { display: grid; gap: 6px; }
    .skill-nav button { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; width: 100%; padding: 11px 10px; border: 1px solid transparent; border-radius: 11px; color: #b8cdd0; background: transparent; text-align: left; cursor: pointer; transition: color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease; }
    .skill-nav button:hover { color: var(--text); background: rgba(255, 255, 255, .045); }
    .skill-nav button[aria-current="true"] { color: #effffa; border-color: rgba(113, 242, 194, .28); background: linear-gradient(100deg, rgba(113, 242, 194, .14), rgba(0, 188, 212, .055)); }
    .skill-nav button:focus-visible, .control:focus-visible, .open-demo:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    .nav-index { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid rgba(140, 230, 239, .16); border-radius: 9px; color: #85a6ad; font-size: .7rem; }
    .skill-nav button[aria-current="true"] .nav-index { color: var(--mint); border-color: rgba(113, 242, 194, .3); background: rgba(113, 242, 194, .08); }
    .nav-title { overflow: hidden; font-size: .84rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .viewer { display: flex; flex-direction: column; overflow: hidden; }
    .viewer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 16px; }
    .viewer-eyebrow { color: #8ca9b0; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .viewer-title { margin: 4px 0 4px; font-size: 1.35rem; line-height: 1.2; letter-spacing: -.025em; }
    .viewer-description { max-width: 600px; margin: 0; color: var(--muted); font-size: .86rem; }
    .viewer-count { flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: #b8d1d5; background: rgba(3, 15, 22, .4); font: 500 .73rem/1 Roboto, sans-serif; }
    .progress-track { height: 2px; margin: 0 22px 14px; overflow: hidden; background: rgba(255, 255, 255, .08); }
    .progress-fill { width: 16.666%; height: 100%; background: linear-gradient(90deg, var(--mint), var(--cyan)); transition: width .25s ease; }
    .frame-wrap { min-height: 570px; margin: 0 14px; overflow: hidden; border: 1px solid rgba(140, 230, 239, .15); border-radius: 12px; background: #07131b; }
    .demo-frame { display: block; width: 100%; height: min(68vh, 760px); min-height: 570px; border: 0; background: #07131b; opacity: 1; transition: opacity .18s ease; }
    .demo-frame.is-loading { opacity: .35; }
    .viewer-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 18px; }
    .control { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; color: #d8e9eb; background: rgba(255, 255, 255, .035); cursor: pointer; transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease; }
    .control:hover:not(:disabled) { transform: translateY(-1px); color: var(--mint); border-color: rgba(113, 242, 194, .44); background: rgba(113, 242, 194, .08); }
    .control:disabled { opacity: .42; cursor: not-allowed; }
    .step-status { color: #8ca9b0; font-size: .76rem; text-align: center; }
    .mobile-nav { display: none; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 32px, 720px); padding-top: 18px; }
      .topbar { margin-bottom: 26px; }
      .lab-layout { grid-template-columns: 1fr; }
      .sidebar { padding: 12px; }
      .sidebar-heading { padding-bottom: 9px; }
      .skill-nav { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
      .skill-nav button { flex: 0 0 auto; width: auto; grid-template-columns: 26px auto; padding: 8px 10px; }
      .nav-index { width: 25px; height: 25px; }
      .frame-wrap { min-height: 520px; }
      .demo-frame { height: 72vh; min-height: 520px; }
    }
    @media (max-width: 520px) {
      .shell { width: calc(100% - 22px); padding-top: 12px; }
      .topbar { align-items: flex-start; flex-direction: column-reverse; gap: 11px; margin-bottom: 23px; }
      .brand-mark { padding-left: 3px; }
      .intro { margin-bottom: 20px; }
      .intro p { font-size: .91rem; }
      .sidebar, .viewer { border-radius: 14px; }
      .viewer-head { padding: 16px 14px 13px; }
      .viewer-title { font-size: 1.12rem; }
      .viewer-description { font-size: .79rem; }
      .progress-track { margin-right: 14px; margin-left: 14px; }
      .frame-wrap { min-height: 450px; margin: 0 8px; }
      .demo-frame { height: 68vh; min-height: 450px; }
      .viewer-controls { padding: 12px 10px 14px; }
      .control { min-height: 40px; padding: 8px 10px; font-size: .82rem; }
      .step-status { max-width: 76px; font-size: .68rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Skills Lab navigation">
      <a class="back-link" href="../index.html#skillsDropdown"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Skills</a>
      <span class="brand-mark">Antonio Gómez / Interactive Lab</span>
    </nav>

    <header class="intro">
      <span class="eyebrow">Explore and experiment</span>
      <h1>Skills Lab</h1>
      <p>Step through interactive projects one at a time. Choose a demo from the navigation or move through the collection with the controls.</p>
    </header>

    <section class="lab-layout" aria-label="Interactive skills viewer">
      <aside class="sidebar" aria-label="Choose a demo">
        <div class="sidebar-heading"><span>Experiences</span><span class="item-count">6 demos</span></div>
        <nav class="skill-nav" id="skillNav" aria-label="Skills Lab demos"></nav>
      </aside>

      <section class="viewer" aria-labelledby="viewerTitle">
        <div class="viewer-head">
          <div>
            <span class="viewer-eyebrow">Selected experience</span>
            <h2 class="viewer-title" id="viewerTitle">Snake AI</h2>
            <p class="viewer-description" id="viewerDescription"></p>
          </div>
          <span class="viewer-count" id="viewerCount" aria-live="polite">01 / 06</span>
        </div>
        <div class="progress-track" role="progressbar" id="progressTrack" aria-label="Skills Lab progress" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"><div class="progress-fill" id="progressFill"></div></div>
        <div class="frame-wrap"><iframe class="demo-frame" id="demoFrame" title="Snake AI interactive demo" loading="eager"></iframe></div>
        <div class="viewer-controls">
          <button class="control" id="previousButton" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i><span>Previous</span></button>
          <span class="step-status" id="stepStatus" aria-live="polite">Demo 1 of 6</span>
          <button class="control" id="nextButton" type="button"><span>Next</span><i class="fas fa-arrow-right" aria-hidden="true"></i></button>
        </div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var demos = [
        { title: "Snake AI", url: "snake-game.html", description: "Play the classic grid game or watch an agent navigate with a safety-first strategy." },
        { title: "Sorting Visualizer", url: "sorting-visualizer.html", description: "Compare sorting methods as the data rearranges in a live visual display." },
        { title: "A* Pathfinding", url: "astar-visualizer.html", description: "Draw obstacles on a grid and watch heuristic search find a route." },
        { title: "Fireworks Particles", url: "particle-system.html", description: "Create glowing particle bursts and explore a multi-stage visual system." },
        { title: "Critical Path Simulator", url: "cpm.html", description: "Adjust task durations and see dependencies, slack, and delivery timing update." },
        { title: "2D Raycasting", url: "raycasting.html", description: "Move a light source and obstacles to explore real-time rays and soft shadows." }
      ];
      var nav = document.getElementById("skillNav");
      var frame = document.getElementById("demoFrame");
      var title = document.getElementById("viewerTitle");
      var description = document.getElementById("viewerDescription");
      var count = document.getElementById("viewerCount");
      var progress = document.getElementById("progressFill");
      var progressTrack = document.getElementById("progressTrack");
      var status = document.getElementById("stepStatus");
      var previous = document.getElementById("previousButton");
      var next = document.getElementById("nextButton");
      var current = 0;
      var navButtons = [];

      function render(index) {
        current = Math.max(0, Math.min(demos.length - 1, index));
        var demo = demos[current];
        title.textContent = demo.title;
        description.textContent = demo.description;
        count.textContent = String(current + 1).padStart(2, "0") + " / " + String(demos.length).padStart(2, "0");
        status.textContent = "Demo " + (current + 1) + " of " + demos.length;
        progress.style.width = ((current + 1) / demos.length * 100) + "%";
        progressTrack.setAttribute("aria-valuenow", String(current + 1));
        previous.disabled = current === 0;
        next.disabled = current === demos.length - 1;
        frame.title = demo.title + " interactive demo";
        frame.classList.add("is-loading");
        frame.src = demo.url;
        navButtons.forEach(function (button, buttonIndex) {
          button.setAttribute("aria-current", buttonIndex === current ? "true" : "false");
        });
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, "", "#" + encodeURIComponent(demo.url.replace(/\.html$/, "")));
        }
      }

      demos.forEach(function (demo, index) {
        var button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-current", "false");
        button.setAttribute("aria-label", "Open " + demo.title);
        button.innerHTML = '<span class="nav-index" aria-hidden="true">' + String(index + 1).padStart(2, "0") + '</span><span class="nav-title"></span>';
        button.querySelector(".nav-title").textContent = demo.title;
        button.addEventListener("click", function () { render(index); });
        nav.appendChild(button);
        navButtons.push(button);
      });

      frame.addEventListener("load", function () { frame.classList.remove("is-loading"); });
      previous.addEventListener("click", function () { render(current - 1); });
      next.addEventListener("click", function () { render(current + 1); });
      document.addEventListener("keydown", function (event) {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("iframe")) return;
        if (event.key === "ArrowLeft" && current > 0) render(current - 1);
        if (event.key === "ArrowRight" && current < demos.length - 1) render(current + 1);
      });

      var hash = decodeURIComponent(window.location.hash.slice(1));
      var startAt = demos.findIndex(function (demo) { return demo.url.replace(/\.html$/, "") === hash; });
      render(startAt >= 0 ? startAt : 0);
    }());
  </script>
</body>
</html>

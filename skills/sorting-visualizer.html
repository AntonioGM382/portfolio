<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Visualizer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#07121b;--panel:#0d1d29;--line:rgba(155,190,203,.16);--muted:#94aab5;--mint:#71f2c2;--blue:#62c8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 18px 48px;background:radial-gradient(ellipse at 50% -20%,#163547 0,transparent 55%),var(--bg);color:#eef8fa;font-family:'Space Grotesk',sans-serif}.shell{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.back,.btn{border:1px solid var(--line);border-radius:999px;text-decoration:none;color:#d8e9ee;padding:10px 15px;background:#112633}.back:hover,.btn:hover{border-color:var(--mint);color:var(--mint)}.eyebrow,.meta{font:500 .72rem 'DM Mono',monospace;color:var(--mint);letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.06em;margin:10px 0}header p{color:var(--muted);max-width:650px;line-height:1.65}.panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(15,35,47,.96),rgba(9,24,34,.96));box-shadow:0 18px 50px #02090e66}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:20px 0}.btn{font:600 .9rem 'Space Grotesk',sans-serif;cursor:pointer}.btn.primary{background:var(--mint);color:#062019;border-color:var(--mint)}select,input{accent-color:var(--mint);color:#eaf7fa;background:#102733;border:1px solid var(--line);padding:9px;border-radius:9px}label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#07131c;border:1px solid var(--line)}.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font: .74rem 'DM Mono',monospace;margin:0 2px 12px}.hint{color:var(--muted);font-size:.82rem}@media(max-width:560px){.top{align-items:flex-start}.controls{gap:7px}.btn{padding:9px 11px}}
</style></head><body><main class="shell"><div class="top"><span class="eyebrow">Interactive lab / 02</span><a class="back" href="../index.html#skills">← Back to Skills</a></div><header><div class="eyebrow">Algorithm visualization</div><h1>Sorting Visualizer<span style="color:var(--mint)">.</span></h1><p>Shuffle a dataset, choose an algorithm, and watch each comparison and swap unfold in real time.</p></header><section class="panel"><div class="controls"><button class="btn primary" id="shuffle">Shuffle</button><button class="btn" data-sort="bubble">Bubble Sort</button><button class="btn" data-sort="quick">Quick Sort</button><label>Speed <input id="speed" type="range" min="1" max="100" value="45"><span id="speedLabel">45%</span></label><label>Bars <select id="size"><option>60</option><option selected>100</option><option>160</option></select></label></div><div class="stats"><span id="status">READY</span><span id="counter">100 items</span></div><canvas id="canvas" width="1000" height="420" aria-label="Sorting bars"></canvas><p class="hint">Bubble Sort is easy to follow. Quick Sort partitions the data around a pivot.</p></section></main><script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),speed=document.querySelector('#speed');let values=[],busy=false,comparisons=0;function draw(active=[],sorted=[]){const w=canvas.width/values.length;ctx.clearRect(0,0,canvas.width,canvas.height);values.forEach((v,i)=>{const h=v*(canvas.height-24);ctx.fillStyle=sorted.includes(i)?'#71f2c2':active.includes(i)?'#62c8ff':'#268b91';ctx.shadowColor=active.includes(i)?'#62c8ff':'transparent';ctx.shadowBlur=active.includes(i)?12:0;ctx.beginPath();ctx.roundRect(i*w+1,canvas.height-h,w*.72,h,Math.min(4,w*.3));ctx.fill()});ctx.shadowBlur=0;document.querySelector('#counter').textContent=`${values.length} items · ${comparisons.toLocaleString()} comparisons`}function shuffle(){if(busy)return;comparisons=0;values=Array.from({length:+document.querySelector('#size').value},()=>.08+Math.random()*.86);document.querySelector('#status').textContent='READY';draw()}function wait(){return new Promise(r=>setTimeout(r,Math.max(4,110-(+speed.value))))}async function bubble(){for(let i=0;i<values.length&&!cancel;i++){for(let j=0;j<values.length-i-1&&!cancel;j++){comparisons++;if(values[j]>values[j+1])[values[j],values[j+1]]=[values[j+1],values[j]];draw([j,j+1],Array.from({length:i},(_,k)=>values.length-1-k));await wait()}}}async function quick(lo=0,hi=values.length-1){if(lo>=hi||cancel)return;let pivot=values[hi],i=lo;for(let j=lo;j<hi&&!cancel;j++){comparisons++;draw([j,hi]);if(values[j]<pivot){[values[i],values[j]]=[values[j],values[i]];i++}await wait()}[values[i],values[hi]]=[values[hi],values[i]];draw([i]);await wait();await quick(lo,i-1);await quick(i+1,hi)}let cancel=false;async function run(kind){if(busy)return;busy=true;cancel=false;comparisons=0;document.querySelector('#status').textContent=kind==='bubble'?'BUBBLE SORT':'QUICK SORT';document.querySelectorAll('[data-sort],#shuffle,#size').forEach(x=>x.disabled=true);if(kind==='bubble')await bubble();else await quick();busy=false;document.querySelectorAll('[data-sort],#shuffle,#size').forEach(x=>x.disabled=false);if(!cancel){document.querySelector('#status').textContent='SORTED';draw([],values.map((_,i)=>i))}}document.querySelector('#shuffle').onclick=shuffle;document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>run(b.dataset.sort));document.querySelector('#size').onchange=shuffle;speed.oninput=()=>document.querySelector('#speedLabel').textContent=`${speed.value}%`;shuffle();
</script></body></html>

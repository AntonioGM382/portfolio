<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{color-scheme:dark;--cyan:#70f3f5;--muted:#a8c7ce;--line:rgba(112,243,245,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Roboto',sans-serif;color:#eaffff;display:flex;flex-direction:column;align-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 0,#174b59 0,transparent 48%),linear-gradient(145deg,#061116,#102d37)}header{text-align:center;margin:20px 0 6px}header h1{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.04em;margin:8px}header p{color:var(--muted);margin:6px}#score{font-size:1.05rem;margin:8px 0 12px;color:var(--cyan);letter-spacing:.04em}canvas{background:#081a20;border:1px solid var(--line);border-radius:16px;image-rendering:pixelated;box-shadow:0 0 0 5px #70f3f50b,0 18px 65px #0008,0 0 32px #31dbe522;max-width:min(90vw,400px);height:auto}.game-over{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;color:var(--cyan);text-align:center;display:none;padding:24px 34px;border:1px solid var(--line);border-radius:18px;background:#07151bea;box-shadow:0 0 40px #31dbe544;z-index:5}.game-over small{font-size:.9rem;color:var(--muted)}#back{position:fixed;top:20px;left:20px;background:#0c7e8d;padding:10px 16px;border-radius:8px;text-decoration:none;color:#fff;font-size:1rem;z-index:10;transition:background .2s}#back:hover{background:#11606b}#controls{display:flex;gap:10px;margin:14px}.control-button{background:linear-gradient(135deg,#0c7e8d,#145a68);color:#eaffff;border:1px solid #70f3f566;border-radius:9px;padding:10px 17px;font:700 1rem 'Roboto',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s}.control-button:hover{transform:translateY(-1px);box-shadow:0 5px 18px #31dbe533}.control-button[aria-pressed="true"]{background:#167788;box-shadow:0 0 0 2px #70f3f5,0 0 20px #31dbe544}#hint{font-size:.85rem;color:#91b1b9;margin:0 0 20px}.back a{color:#70f3f5;text-decoration:none}@media(max-height:650px){header{margin:6px 0 0}header h1{margin:4px}header p{margin:4px}#score{margin:4px}canvas{max-width:min(66vh,400px)}#controls{margin:8px}}
  </style>
</head>
<body>
  <header><h1>Snake Game</h1><p>Arrow keys to play · switch on Auto Play to watch the AI</p></header>
  <div id="score">Score: 0 · Apples: 3</div><canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
  <div id="controls"><button class="control-button" id="autoPlay" type="button" aria-pressed="false">Auto Play: Off</button><button class="control-button" id="restart" type="button">Restart</button></div>
  <p id="hint">Eat apples, avoid your body and the walls.</p><div class="game-over" id="gameOver">Game Over<br/><small>Press R to restart</small></div><div class="back"><a id="back" href="../index.html#skills">← Back to Skills</a></div>
  <script>
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scale=20,rows=canvas.height/scale,cols=canvas.width/scale,APPLE_COUNT=3,MANUAL_TICK_MS=200,AUTO_TICK_MS=55;
    let snake,apples,score=0,running=false,moved=false,autoPlay=false;
    class Snake{constructor(){this.body=[{x:60,y:100},{x:80,y:100},{x:100,y:100}];this.xSpeed=0;this.ySpeed=0;this.growing=false}update(){const h={...this.body.at(-1)};h.x+=this.xSpeed;h.y+=this.ySpeed;this.body.push(h);if(this.growing)this.growing=false;else this.body.shift();moved=true}draw(){this.body.forEach((p,i)=>{const t=i/(this.body.length-1||1);ctx.fillStyle=i===this.body.length-1?'#b6ffff':`hsl(${187-t*15} 72% ${54-t*12}%)`;ctx.shadowColor=i===this.body.length-1?'#70f3f5':'transparent';ctx.shadowBlur=i===this.body.length-1?13:0;ctx.beginPath();ctx.roundRect(p.x+2,p.y+2,16,16,6);ctx.fill()});ctx.shadowBlur=0}changeDirection(name){const d={Up:[0,-20],Down:[0,20],Left:[-20,0],Right:[20,0]}[name];if(!d||d[0]===-this.xSpeed&&d[1]===-this.ySpeed)return;[this.xSpeed,this.ySpeed]=d}eatAt(p){const h=this.body.at(-1);return p&&h.x===p.x&&h.y===p.y}hasCollision(){const h=this.body.at(-1);return h.x<0||h.x>=400||h.y<0||h.y>=400||this.body.slice(0,-1).some(p=>p.x===h.x&&p.y===h.y)}}
    function randomApple(occupied){const free=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const p={x:x*20,y:y*20};if(!occupied.some(q=>q.x===p.x&&q.y===p.y))free.push(p)}return free.length?free[Math.floor(Math.random()*free.length)]:null}function addApples(){while(apples.length<APPLE_COUNT){const a=randomApple([...snake.body,...apples]);if(!a)break;apples.push(a)}}
    function drawApples(){apples.forEach((a,i)=>{const pulse=1+Math.sin(Date.now()/220+i)*.08;ctx.save();ctx.shadowColor='#ff8290';ctx.shadowBlur=13;ctx.fillStyle=i===0?'#ff7a8a':'#ff9a78';ctx.beginPath();ctx.arc(a.x+10,a.y+10,6.5*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffd0a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.x+10,a.y+3);ctx.lineTo(a.x+12,a.y);ctx.stroke();ctx.restore()})}function drawGrid(){ctx.fillStyle='#091c22';ctx.fillRect(0,0,400,400);ctx.strokeStyle='rgba(112,243,245,.075)';for(let x=20;x<400;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=20;y<400;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(400,y);ctx.stroke()}}function updateScore(){document.getElementById('score').textContent=`Score: ${score} · Apples: ${apples.length}`}function render(){ctx.clearRect(0,0,400,400);drawGrid();drawApples();snake.draw()}
    const dirs=[{x:0,y:-1,name:'Up'},{x:1,y:0,name:'Right'},{x:0,y:1,name:'Down'},{x:-1,y:0,name:'Left'}],key=p=>`${p.x},${p.y}`;
    function findPathTo(target,body){const h=body.at(-1),start={x:h.x/20,y:h.y/20},blocked=new Set(body.slice(0,-1).map(p=>`${p.x/20},${p.y/20}`));blocked.delete(`${body[0].x/20},${body[0].y/20}`);const q=[{...start,path:[]}],seen=new Set([key(start)]);for(let i=0;i<q.length;i++){const n=q[i];if(target&&n.x===target.x/20&&n.y===target.y/20)return{path:n.path,distance:n.path.length};for(const d of dirs){const x=n.x+d.x,y=n.y+d.y,k=`${x},${y}`;if(x<0||x>=cols||y<0||y>=rows||blocked.has(k)||seen.has(k))continue;seen.add(k);q.push({x,y,path:[...n.path,d.name]})}}return null}
    function findLongPathTo(target,body){const h=body.at(-1),goal={x:target.x/20,y:target.y/20},start={x:h.x/20,y:h.y/20},blocked=new Set(body.slice(1,-1).map(p=>`${p.x/20},${p.y/20}`)),visited=new Set([key(start)]);let best=[],bestLength=-1,steps=0,path=[];function walk(x,y){if(++steps>5000)return;if(x===goal.x&&y===goal.y){if(path.length>bestLength){bestLength=path.length;best=path.slice()}return}if(path.length+Math.abs(x-goal.x)+Math.abs(y-goal.y)<=bestLength)return;for(const d of dirs){const nx=x+d.x,ny=y+d.y,k=`${nx},${ny}`;if(nx<0||nx>=cols||ny<0||ny>=rows||blocked.has(k)||visited.has(k))continue;visited.add(k);path.push(d.name);walk(nx,ny);path.pop();visited.delete(k)}}walk(start.x,start.y);return best.length?{path:best}:null}
    function simulateRoute(body,path,apple){let b=body.map(p=>({...p}));for(const name of path){const d=dirs.find(v=>v.name===name),h=b.at(-1),next={x:h.x+d.x*20,y:h.y+d.y*20},eats=apple&&next.x===apple.x&&next.y===apple.y;b.push(next);if(!eats)b.shift()}return b}
    function floodArea(body){const h=body.at(-1),blocked=new Set(body.slice(0,-1).map(key));blocked.delete(key(body[0]));const start={x:h.x/20,y:h.y/20},q=[start],seen=new Set([key(start)]);for(let i=0;i<q.length;i++)for(const d of dirs){const p={x:q[i].x+d.x,y:q[i].y+d.y},k=key(p);if(p.x<0||p.x>=cols||p.y<0||p.y>=rows||blocked.has(`${p.x*20},${p.y*20}`)||seen.has(k))continue;seen.add(k);q.push(p)}return seen.size}
    function chooseAutoDirection(){const choices=[];for(const apple of apples){const route=findPathTo(apple,snake.body);if(!route?.path.length)continue;const simulated=simulateRoute(snake.body,route.path,apple),tail=simulated[0],escape=findPathTo(tail,simulated),space=floodArea(simulated),adaptiveMargin=Math.max(6,Math.min(simulated.length,Math.floor((400-simulated.length)*.15)));if(!escape||space<adaptiveMargin)continue;choices.push({first:route.path[0],distance:route.distance,space})}choices.sort((a,b)=>b.space-a.space||a.distance-b.distance);if(choices.length){snake.changeDirection(choices[0].first);return}
      // Prefer a long simple route to the moving tail: this unwinds the body instead of orbiting on a shortest route.
      const tailRoute=findLongPathTo(snake.body[0],snake.body);if(tailRoute?.path.length){snake.changeDirection(tailRoute.path[0]);return}
      const h=snake.body.at(-1),options=dirs.filter(d=>!(d.x===-snake.xSpeed/20&&d.y===-snake.ySpeed/20)).map(d=>{const p={x:h.x+d.x*20,y:h.y+d.y*20};if(p.x<0||p.x>=400||p.y<0||p.y>=400||snake.body.slice(1,-1).some(s=>s.x===p.x&&s.y===p.y))return null;return{name:d.name,space:floodArea([...snake.body.slice(1),p])}}).filter(Boolean).sort((a,b)=>b.space-a.space);if(options[0])snake.changeDirection(options[0].name)
    }
    function gameLoop(){if(!running)return;setTimeout(()=>{if(!running)return;if(autoPlay)chooseAutoDirection();drawGrid();snake.update();const i=apples.findIndex(a=>snake.eatAt(a));if(i>=0){apples.splice(i,1);snake.growing=true;score++;addApples();updateScore();if(!apples.length){gameOver(true);return}}snake.draw();drawApples();if(moved&&snake.hasCollision()){gameOver();return}gameLoop()},autoPlay?AUTO_TICK_MS:MANUAL_TICK_MS)}function gameOver(won=false){running=false;document.getElementById('gameOver').innerHTML=won?`Board cleared!<br/><small>Score: ${score} · Press R to play again</small>`:`Game Over<br/><small>Score: ${score} · Press R to restart</small>`;document.getElementById('gameOver').style.display='block'}function restart(){snake=new Snake();apples=[];addApples();score=0;moved=false;running=false;document.getElementById('gameOver').style.display='none';updateScore();render()}
    document.getElementById('autoPlay').addEventListener('click',e=>{autoPlay=!autoPlay;e.currentTarget.setAttribute('aria-pressed',String(autoPlay));e.currentTarget.textContent=`Auto Play: ${autoPlay?'On':'Off'}`;if(autoPlay&&!running){running=true;gameLoop()}});document.getElementById('restart').addEventListener('click',restart);window.addEventListener('keydown',e=>{const dir=e.key.replace('Arrow','');if(e.key.toLowerCase()==='r'){restart();return}if(!['Up','Down','Left','Right'].includes(dir))return;e.preventDefault();if(autoPlay)return;if(!running){snake.changeDirection(dir);running=true;gameLoop();return}snake.changeDirection(dir)});restart();
  </script>
</body>
</html>

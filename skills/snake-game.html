<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body { margin:0; font-family:'Roboto',sans-serif; background:#0f2027; color:#fff; display:flex; flex-direction:column; align-items:center; height:100vh; overflow:hidden; }
    header { text-align:center; margin:20px 0 10px; }
    #score { font-size:1.2rem; margin-bottom:10px; color:#00eaff; }
    canvas { background:#fff; border:4px solid #00bcd4; border-radius:10px; image-rendering:pixelated; }
    .game-over { position:absolute; top:50%; transform:translateY(-50%); font-size:2rem; color:#ff5252; text-align:center; display:none; }
    #back { position:fixed; top:20px; left:20px; background:#00bcd4; padding:10px 16px; border-radius:6px; text-decoration:none; color:#fff; font-size:1rem; font-weight:500; z-index:10; transition:background .3s; }
    #back:hover { background:#008c9e; }
    .back a { color:#00bcd4; text-decoration:none; }
    .back a:hover { color:#fff; }
    #controls { display:flex; gap:10px; margin:12px; }
    .control-button { background:#00bcd4; color:#fff; border:0; border-radius:6px; padding:10px 16px; font:700 1rem 'Roboto',sans-serif; cursor:pointer; }
    .control-button:hover { background:#008c9e; }
    .control-button[aria-pressed="true"] { background:#008c9e; box-shadow:0 0 0 2px #00eaff; }
    @media(max-height:600px) { header { margin:8px 0 2px; } header h1 { margin:4px; } header p { margin:4px; } canvas { width:min(62vh,400px); height:min(62vh,400px); } }
  </style>
</head>
<body>
  <header><h1>Snake Game</h1><p>Use arrow keys to play or enable Auto Play</p></header>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="controls"><button class="control-button" id="autoPlay" type="button" aria-pressed="false">Auto Play: Off</button><button class="control-button" id="restart" type="button">Restart</button></div>
  <div class="game-over" id="gameOver">Game Over<br/><small>Press R to Restart</small></div>
  <div class="back"><a id="back" href="../index.html#skills">← Back to Skills</a></div>
  <script>
    const canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), scale=20;
    const rows=canvas.height/scale, cols=canvas.width/scale;
    let snake, fruit, score=0, running=false, moved=false, autoPlay=false;
    class Snake {
      constructor(){ this.body=[{x:scale*3,y:scale*5},{x:scale*4,y:scale*5},{x:scale*5,y:scale*5}]; this.xSpeed=0; this.ySpeed=0; this.growing=false; }
      update(){ const head={...this.body[this.body.length-1]}; head.x+=this.xSpeed; head.y+=this.ySpeed; this.body.push(head); if(this.growing)this.growing=false;else this.body.shift(); moved=true; }
      draw(){ for(let i=0;i<this.body.length;i++){ctx.fillStyle=i===this.body.length-1?'#00eaff':'#4dd0e1';ctx.fillRect(this.body[i].x,this.body[i].y,scale-2,scale-2);} }
      changeDirection(dir){
        const directions={Up:[0,-scale],Down:[0,scale],Left:[-scale,0],Right:[scale,0]}, [dx,dy]=directions[dir];
        if(dx===-this.xSpeed&&dy===-this.ySpeed)return;
        this.xSpeed=dx;this.ySpeed=dy;
      }
      eat(target){const head=this.body[this.body.length-1];if(head.x===target.x&&head.y===target.y){this.growing=true;return true;}return false;}
      hasCollision(){const head=this.body[this.body.length-1];if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height)return true;return this.body.slice(0,-1).some(seg=>seg.x===head.x&&seg.y===head.y);}
    }
    function randomFruit(){const empty=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!snake.body.some(p=>p.x===x*scale&&p.y===y*scale))empty.push({x:x*scale,y:y*scale});return empty.length?empty[Math.floor(Math.random()*empty.length)]:null;}
    function drawFruit(){if(!fruit)return;ctx.beginPath();ctx.fillStyle='#ff5252';ctx.arc(fruit.x+scale/2,fruit.y+scale/2,scale/2.5,0,Math.PI*2);ctx.fill();}
    function drawGrid(){ctx.strokeStyle='#eee';for(let x=0;x<canvas.width;x+=scale){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}for(let y=0;y<canvas.height;y+=scale){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}}
    function renderInitialScreen(){ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid();snake.draw();drawFruit();}
    // BFS finds the shortest route to food while treating the moving tail as a legal cell.
    function findPath(){
      const head=snake.body[snake.body.length-1], start={x:head.x/scale,y:head.y/scale};
      const dirs=[{x:0,y:-1,name:'Up'},{x:1,y:0,name:'Right'},{x:0,y:1,name:'Down'},{x:-1,y:0,name:'Left'}];
      const occupied=new Set(snake.body.slice(0,-1).map(p=>`${p.x/scale},${p.y/scale}`));
      if(!snake.growing)occupied.delete(`${snake.body[0].x/scale},${snake.body[0].y/scale}`);
      const queue=[{...start,first:null}], seen=new Set([`${start.x},${start.y}`]);
      for(let i=0;i<queue.length;i++){
        const node=queue[i];if(fruit&&node.x===fruit.x/scale&&node.y===fruit.y/scale)return node.first;
        for(const d of dirs){const x=node.x+d.x,y=node.y+d.y,key=`${x},${y}`;if(x<0||x>=cols||y<0||y>=rows||occupied.has(key)||seen.has(key))continue;seen.add(key);queue.push({x,y,first:node.first||d.name});}
      }
      return null;
    }
    // If food is blocked, follow the tail; a legal fallback is safer than a greedy turn.
    function chooseAutoDirection(){
      const path=findPath();if(path){snake.changeDirection(path);return;}
      const head=snake.body[snake.body.length-1], tail=snake.body[0];
      const dirs=[{name:'Up',dx:0,dy:-1},{name:'Right',dx:1,dy:0},{name:'Down',dx:0,dy:1},{name:'Left',dx:-1,dy:0}];
      const legal=dirs.filter(d=>!(d.dx===-snake.xSpeed/scale&&d.dy===-snake.ySpeed/scale)).map(d=>({...d,x:head.x/scale+d.dx,y:head.y/scale+d.dy})).filter(d=>d.x>=0&&d.x<cols&&d.y>=0&&d.y<rows&&!snake.body.slice(1,-1).some(p=>p.x===d.x*scale&&p.y===d.y*scale));
      legal.sort((a,b)=>Math.abs(a.x-tail.x/scale)+Math.abs(a.y-tail.y/scale)-Math.abs(b.x-tail.x/scale)-Math.abs(b.y-tail.y/scale));
      if(legal.length)snake.changeDirection(legal[0].name);
    }
    function gameLoop(){if(!running)return;setTimeout(()=>{if(!running)return;if(autoPlay)chooseAutoDirection();ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid();snake.update();if(snake.eat(fruit)){score++;fruit=randomFruit();document.getElementById('score').innerText=`Score: ${score}`;if(!fruit){gameOver(true);return;}}snake.draw();drawFruit();if(moved&&snake.hasCollision()){gameOver();return;}gameLoop();},200);}
    function gameOver(won=false){running=false;document.getElementById('gameOver').innerHTML=won?'You Win!<br/><small>Press R to play again</small>':'Game Over<br/><small>Press R to Restart</small>';document.getElementById('gameOver').style.display='block';}
    function restart(){snake=new Snake();fruit=randomFruit();score=0;moved=false;running=false;document.getElementById('score').innerText='Score: 0';document.getElementById('gameOver').style.display='none';renderInitialScreen();}
    document.getElementById('autoPlay').addEventListener('click',e=>{autoPlay=!autoPlay;e.currentTarget.setAttribute('aria-pressed',String(autoPlay));e.currentTarget.textContent=`Auto Play: ${autoPlay?'On':'Off'}`;if(autoPlay&&!running){running=true;gameLoop();}});
    document.getElementById('restart').addEventListener('click',restart);
    window.addEventListener('keydown',e=>{const dir=e.key.replace('Arrow','');if(e.key.toLowerCase()==='r'){restart();return;}if(!['Up','Down','Left','Right'].includes(dir))return;e.preventDefault();if(autoPlay)return;if(!running){snake.changeDirection(dir);running=true;gameLoop();return;}snake.changeDirection(dir);});
    restart();
  </script>
</body>
</html>

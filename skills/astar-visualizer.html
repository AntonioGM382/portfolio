<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A* Pathfinding Visualizer</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#07121b;--panel:#0d1d29;--line:rgba(155,190,203,.16);--muted:#94aab5;--mint:#71f2c2;--blue:#62c8ff;--red:#ff8290}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 18px 48px;background:radial-gradient(ellipse at 50% -20%,#163547 0,transparent 55%),var(--bg);color:#eef8fa;font-family:'Space Grotesk',sans-serif}.shell{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.back,.btn{border:1px solid var(--line);border-radius:999px;text-decoration:none;color:#d8e9ee;padding:10px 15px;background:#112633}.back:hover,.btn:hover{border-color:var(--mint);color:var(--mint)}.eyebrow,.meta{font:500 .72rem 'DM Mono',monospace;color:var(--mint);letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.06em;margin:10px 0}header p{color:var(--muted);max-width:680px;line-height:1.65}.panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(15,35,47,.96),rgba(9,24,34,.96));box-shadow:0 18px 50px #02090e66}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.btn{font:600 .9rem 'Space Grotesk',sans-serif;cursor:pointer}.btn.primary{background:var(--mint);color:#062019;border-color:var(--mint)}.btn:disabled{opacity:.5;cursor:wait}.stats{display:flex;justify-content:space-between;color:var(--muted);font:.74rem 'DM Mono',monospace;margin:0 2px 12px}.grid-wrap{overflow:auto;border-radius:12px;background:#07131c;padding:6px}.grid{display:grid;gap:2px;width:max-content;margin:auto;touch-action:none;user-select:none;-webkit-user-select:none}.node{width:clamp(13px,2.2vw,22px);height:clamp(13px,2.2vw,22px);border-radius:4px;background:#142b36;border:1px solid #20404b;transition:background .15s,transform .15s}.node:hover{transform:scale(1.12);z-index:1}.node.wall{background:#50636b;border-color:#647780}.node.start{background:var(--mint);box-shadow:0 0 13px #71f2c277}.node.end{background:var(--red);box-shadow:0 0 13px #ff829077}.node.visited{background:#176f80;animation:pop .18s}.node.path{background:#f5d06f;box-shadow:0 0 10px #f5d06f66}.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:.78rem;margin:12px 2px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mint)}.dot.end{background:var(--red)}.dot.wall{background:#647780}.dot.path{background:#f5d06f}@keyframes pop{from{transform:scale(.45)}to{transform:scale(1)}}@media(max-width:560px){.top{align-items:flex-start}.panel{padding:10px}.controls{gap:7px}.btn{padding:9px 11px}}
</style></head><body><main class="shell"><div class="top"><span class="eyebrow">Interactive lab / 03</span><a class="back" href="../index.html#skills">← Back to Skills</a></div><header><div class="eyebrow">Pathfinding algorithms</div><h1>A* Pathfinding<span style="color:var(--mint)">.</span></h1><p>Draw walls on the grid and watch A* explore candidate routes. The highlighted path is shortest for the four-direction movement model.</p></header><section class="panel"><div class="controls"><button class="btn primary" id="run">Visualize A*</button><button class="btn" id="clearPath">Clear Path</button><button class="btn" id="clearBoard">Reset Board</button></div><div class="stats"><span id="status">READY · DRAG TO DRAW WALLS</span><span id="count">0 visited</span></div><div class="grid-wrap"><div class="grid" id="grid" role="grid" aria-label="Pathfinding grid"></div></div><div class="legend"><span><i class="dot"></i>Start</span><span><i class="dot end"></i>Goal</span><span><i class="dot wall"></i>Wall</span><span><i class="dot path"></i>Shortest path</span></div></section></main><script>
const R=20,C=40,gridEl=document.querySelector('#grid');gridEl.style.gridTemplateColumns=`repeat(${C},clamp(13px,2.2vw,22px))`;let cells=[],walls=new Set(),busy=false,drawing=false;const start=10*C+5,goal=10*C+35;function build(){gridEl.innerHTML='';cells=[];for(let i=0;i<R*C;i++){const e=document.createElement('div');e.className='node';e.dataset.index=i;e.setAttribute('role','gridcell');if(i===start)e.classList.add('start');if(i===goal)e.classList.add('end');e.onpointerdown=ev=>{if(busy||i===start||i===goal)return;ev.preventDefault();drawing=true;toggle(i)};gridEl.append(e);cells.push(e)}drawWalls()}gridEl.addEventListener('pointermove',ev=>{if(!drawing||busy)return;const node=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.node');if(!node||!gridEl.contains(node))return;const i=Number(node.dataset.index);if(i!==start&&i!==goal){walls.add(i);cells[i].classList.add('wall')}});function finishDrawing(){drawing=false}window.addEventListener('pointerup',finishDrawing);window.addEventListener('pointercancel',finishDrawing);function toggle(i){walls.has(i)?walls.delete(i):walls.add(i);cells[i].classList.toggle('wall',walls.has(i))}function drawWalls(){walls.forEach(i=>cells[i]?.classList.add('wall'))}function neighbors(i){const r=Math.floor(i/C),c=i%C;return [r?i-C:-1,r<R-1?i+C:-1,c?i-1:-1,c<C-1?i+1:-1].filter(n=>n>=0)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function clearMarks(){cells.forEach((e,i)=>{e.classList.remove('visited','path');if(i===start)e.classList.add('start');if(i===goal)e.classList.add('end')})}async function solve(){if(busy)return;busy=true;clearMarks();const g=Array(R*C).fill(Infinity),came=Array(R*C).fill(-1),closed=new Set(),open=new Set([start]);g[start]=0;const h=i=>Math.abs(Math.floor(i/C)-Math.floor(goal/C))+Math.abs(i%C-goal%C);let visits=0;document.querySelector('#status').textContent='SEARCHING';while(open.size){const cur=[...open].reduce((a,b)=>g[a]+h(a)<=g[b]+h(b)?a:b);open.delete(cur);if(cur===goal){let path=[];for(let n=goal;n!==start;n=came[n])path.push(n);path.reverse();for(const n of path){cells[n].classList.add('path');await sleep(12)}document.querySelector('#status').textContent='PATH FOUND';document.querySelector('#count').textContent=`${visits} visited · ${path.length} steps`;busy=false;return}closed.add(cur);visits++;if(cur!==start)cells[cur].classList.add('visited');if(visits%8===0){document.querySelector('#count').textContent=`${visits} visited`;await sleep(12)}for(const n of neighbors(cur)){if(walls.has(n)||closed.has(n))continue;const tentative=g[cur]+1;if(tentative<g[n]){came[n]=cur;g[n]=tentative;open.add(n)}}}document.querySelector('#status').textContent='NO PATH FOUND';document.querySelector('#count').textContent=`${visits} visited`;busy=false}document.querySelector('#run').onclick=solve;document.querySelector('#clearPath').onclick=()=>{if(busy)return;clearMarks();document.querySelector('#status').textContent='READY · DRAG TO DRAW WALLS';document.querySelector('#count').textContent='0 visited'};document.querySelector('#clearBoard').onclick=()=>{if(busy)return;walls.clear();build();document.querySelector('#status').textContent='READY · DRAG TO DRAW WALLS';document.querySelector('#count').textContent='0 visited'};build();
</script></body></html>
